name: ACD-068 source fetch

on:
  push:
    branches:
      - acd-068-fetch
    paths:
      - .github/workflows/acd-068-fetch.yml

permissions:
  contents: read

env:
  CURRENT_OFFICIAL: https://qualifications.pearson.com/content/dam/pdf/International%20Advanced%20Level/Mathematics/2018/Specification-and-Sample-Assessment/international-a-level-maths-spec.pdf
  CURRENT_MIRROR: https://syllabus.papacambridge.com/directories/Pearson/Pearson-syllabus/upload/international-a-level-maths-spec-issue3.pdf
  LEGACY_OFFICIAL: https://qualifications.pearson.com/content/dam/pdf/International%20Advanced%20Level/Mathematics/2013/Specification%20and%20sample%20assessments/9781446925201_IAL_Maths_Iss3.pdf

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download controlling specification binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 \
            "$CURRENT_OFFICIAL" -o artifact/current-official-specification.pdf \
            || curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 \
              "$CURRENT_MIRROR" -o artifact/current-official-specification.pdf
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 \
            "$LEGACY_OFFICIAL" -o artifact/legacy-official-specification.pdf
          file artifact/*.pdf
          sha256sum artifact/*.pdf | tee artifact/SHA256SUMS.txt
          stat --printf='%n\t%s bytes\n' artifact/*.pdf | tee artifact/SIZES.txt
          python - <<'PY'
          from pathlib import Path
          for p in Path('artifact').glob('*.pdf'):
              b = p.read_bytes()
              if not b.startswith(b'%PDF-'):
                  raise SystemExit(f'{p} is not a PDF')
              if len(b) < 100_000:
                  raise SystemExit(f'{p} is unexpectedly small: {len(b)}')
          PY
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: acd-068-source-binaries
          path: artifact/
          if-no-files-found: error
          retention-days: 7
