name: Temporary acquire Cambridge 0478 current specimen

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install validators
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Discover and download official specimen files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/files
          page='https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-igcse-computer-science-0478/past-papers/'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 -A "$ua" "$page" -o out/page.html

          python - <<'PY'
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          text=Path('out/page.html').read_text('utf-8','replace')
          base='https://www.cambridgeinternational.org'
          rows=[]
          # capture anchors and nearby text; retain official PDF links associated with specimen materials or 2026/2028 updates
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, re.I|re.S):
              href=html.unescape(m.group(1)).strip()
              label=re.sub(r'<[^>]+>',' ',m.group(2))
              label=html.unescape(re.sub(r'\s+',' ',label)).strip()
              url=urljoin(base,href)
              blob=(label+' '+url).lower()
              if url.lower().endswith('.pdf') and ('specimen' in blob or ('0478' in blob and any(y in blob for y in ['2026','2028']))):
                  rows.append({'label':label,'url':url})
          # dedupe
          seen=set(); out=[]
          for r in rows:
              if r['url'] not in seen:
                  seen.add(r['url']); out.append(r)
          Path('out/discovered.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY

          python - <<'PY'
          import json, os, re, subprocess, urllib.parse
          from pathlib import Path
          rows=json.loads(Path('out/discovered.json').read_text())
          if not rows:
              raise SystemExit('No specimen links discovered')
          manifest=[]
          for i,r in enumerate(rows,1):
              url=r['url']
              name=os.path.basename(urllib.parse.urlparse(url).path) or f'specimen_{i}.pdf'
              name=re.sub(r'[^A-Za-z0-9._-]+','_',name)
              dest=Path('out/files')/name
              subprocess.run(['curl','--fail','--location','--retry','4','--retry-all-errors','--connect-timeout','20','--max-time','180','-A','Mozilla/5.0',url,'-o',str(dest)],check=True)
              if dest.read_bytes()[:5] != b'%PDF-':
                  raise SystemExit(f'Invalid PDF signature: {name}')
              info=subprocess.check_output(['pdfinfo',str(dest)],text=True,errors='replace')
              pages=None
              for line in info.splitlines():
                  if line.startswith('Pages:'):
                      pages=int(line.split(':',1)[1].strip())
              sha=subprocess.check_output(['sha256sum',str(dest)],text=True).split()[0]
              manifest.append({'label':r['label'],'url':url,'filename':name,'bytes':dest.stat().st_size,'pages':pages,'sha256':sha})
          Path('out/manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-0478-current-specimen-20260727
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
