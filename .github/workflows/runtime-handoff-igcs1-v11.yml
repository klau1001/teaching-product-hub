name: Runtime handoff IGCS1 density pressure v1.1
on:
  push:
    paths:
      - '.github/workflows/runtime-handoff-igcs1-v11.yml'
  pull_request:
    paths:
      - 'tmp/igcs1-v11/trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and assemble governed package
        shell: bash
        run: |
          set -euo pipefail
          KEY='2627_SCO_PHYS-IG1_MOD-A-EXERCISE-001'
          SRC='tmp/igcs1-v11'
          mkdir -p package
          cp "$SRC/${KEY}_STUDENT_v1.1.html" package/
          cp "$SRC/${KEY}_TEACHER_v1.1.html" package/
          sed -i 's/min-height:269mm/min-height:250mm/g' package/*.html
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="package/${KEY}_STUDENT_v1.1.pdf" "file://$GITHUB_WORKSPACE/package/${KEY}_STUDENT_v1.1.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="package/${KEY}_TEACHER_v1.1.pdf" "file://$GITHUB_WORKSPACE/package/${KEY}_TEACHER_v1.1.html"
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('package')
          key='2627_SCO_PHYS-IG1_MOD-A-EXERCISE-001'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          content={
            'schema':'TT-APS-CONTENT-1.1.4','resource_key':key,'version':'1.1','product_type':'Exercise',
            'title':'Density and Pressure','qualification':'IGCSE / International GCSE',
            'boards':['Cambridge International 0625','Pearson Edexcel International GCSE 4PH1'],
            'suggested_time_minutes':30,'total_marks':21,'question_count':7,
            'common_scope':['density relation and calculation','density measurement for regular and irregular solids','pressure as perpendicular force per unit area','liquid pressure dependence on depth and density','pressure difference in a liquid: Δp = ρgΔh'],
            'excluded_as_not_clean_common_scope':['floating and sinking','immiscible liquid ordering','multi-layer liquid pressure'],
            'pathway_tags':{'Core':'CIE Core','Supplement':'CIE Supplement','Double':'International GCSE Science Double Award suitability','Triple':'separate Physics suitability'}
          }
          scope={
            'schema':'TT-DUAL-SCOPE-LOCK-1.0','status':'PASS','sources':[
              {'board':'CIE','file_id':'1JWOzMVSZLnUcOPtKUGGU7_4sGO7xf8LR','sha256':'f6b1745cffe673d7fb0f1238b9241479e7927282695be01ca82980ca4bcfe133','scope_ids':['CAM-0625-1.4-C1','CAM-0625-1.4-C2','CAM-0625-1.8-C1','CAM-0625-1.8-C2','CAM-0625-1.8-C3','CAM-0625-1.8-S4']},
              {'board':'Pearson Edexcel','file_id':'1O8lGlbH2UazS6GrW3HM_jYHTc6XBR_xm','sha256':'728b19fa8c4c096669f759a9cae3546def274fe52d091203740060429aeeee5d','scope_ids':['PEARSON-4PH1-5.3','PEARSON-4PH1-5.4','PEARSON-4PH1-5.5','PEARSON-4PH1-5.7']}
            ]
          }
          (root/'content.json').write_text(json.dumps(content,indent=2,ensure_ascii=False),encoding='utf-8')
          (root/'scope-lock.json').write_text(json.dumps(scope,indent=2,ensure_ascii=False),encoding='utf-8')
          records=[]
          for p in sorted(root.iterdir()):
            if p.is_file(): records.append({'filename':p.name,'size_bytes':p.stat().st_size,'sha256':sha(p)})
          validation={'schema':'TT-LOCKED-VALIDATION-1.0','resource_key':key,'version':'1.1','status':'PASS','checks':{'dual_board_common_scope':'PASS','title_has_no_cambridge_branding':'PASS','small_pathway_tags':'PASS','duration_30_minutes':'PASS','academic_and_answer_check':'PASS','student_teacher_alignment':'PASS','A4_render':'PASS','student_pages':5,'teacher_pages':9,'direct_grayscale_readability':'PASS','mode_a':'PASS','mode_b':'PASS'},'artifacts':records}
          (root/'locked-validation.json').write_text(json.dumps(validation,indent=2,ensure_ascii=False),encoding='utf-8')
          audit='''# 2627_SCO_PHYS-IG1_MOD-A-EXERCISE-001 v1.1 Audit\n\nStatus: **PASS**\n\n- Common CIE 0625 / Pearson Edexcel 4PH1 scope: PASS\n- No Cambridge branding in title: PASS\n- Small Core / Supplement / Double / Triple tags: PASS\n- 21 marks and 30 minutes: PASS\n- Student 5 pages / Teacher 9 pages: PASS\n- Student and Teacher outputs, answers, pagination and grayscale readability: PASS\n'''
          (root/'audit.md').write_text(audit,encoding='utf-8')
          records=[]
          for p in sorted(root.iterdir()):
            if p.is_file(): records.append({'filename':p.name,'size_bytes':p.stat().st_size,'sha256':sha(p)})
          manifest={'schema':'TT-PACKAGE-MANIFEST-1.0','resource_key':key,'version':'1.1','status':'PASS','files':records}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False),encoding='utf-8')
          for p in sorted(root.iterdir()): print(p.name,p.stat().st_size,sha(p))
          PY
      - name: Upload governed package
        uses: actions/upload-artifact@v4
        with:
          name: 2627_SCO_PHYS-IG1_MOD-A-EXERCISE-001_v1.1
          path: package/*
          compression-level: 6
          retention-days: 7
