name: Temporary deep discovery Pearson 4CP0 2025 Paper 2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install discovery and validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip poppler-utils
          python -m pip install --quiet selenium requests beautifulsoup4

      - name: Inspect Pearson application traffic and probe package sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/browser out/network_bodies out/probes out/valid_packages out/indexes
          cat > /tmp/discover.py <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.parse
          import zipfile
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          OUT = Path('out')
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36'
          qualification = 'https://qualifications.pearson.com/en/qualifications/edexcel-international-gcses/international-gcse-computer-science-2017.coursematerials.html'
          names = ['4cp0-02-que-20250605.zip', '4cp0-02-rms-20250821.zip']

          chrome = Options()
          chrome.add_argument('--headless=new')
          chrome.add_argument('--no-sandbox')
          chrome.add_argument('--disable-dev-shm-usage')
          chrome.add_argument('--window-size=1600,1200')
          chrome.add_argument(f'--user-agent={UA}')
          chrome.set_capability('goog:loggingPrefs', {'performance': 'ALL', 'browser': 'ALL'})
          driver = webdriver.Chrome(options=chrome)
          driver.execute_cdp_cmd('Network.enable', {})
          response_events = []
          try:
              driver.get(qualification)
              time.sleep(12)
              for _ in range(5):
                  driver.execute_script('window.scrollTo(0, document.body.scrollHeight)')
                  time.sleep(2)
              Path('out/browser/page_source.html').write_text(driver.page_source, encoding='utf-8')
              driver.save_screenshot('out/browser/page.png')
              Path('out/browser/current_url.txt').write_text(driver.current_url, encoding='utf-8')
              links = []
              for a in driver.find_elements('css selector', 'a[href]'):
                  try:
                      links.append({'text': a.text, 'href': a.get_attribute('href')})
                  except Exception:
                      pass
              Path('out/browser/dom_links.json').write_text(json.dumps(links, indent=2), encoding='utf-8')
              cookies = driver.get_cookies()
              Path('out/browser/cookies.json').write_text(json.dumps(cookies, indent=2), encoding='utf-8')
              logs = driver.get_log('performance')
              Path('out/browser/performance_log.json').write_text(json.dumps(logs, indent=2), encoding='utf-8')
              for entry in logs:
                  try:
                      msg = json.loads(entry['message'])['message']
                  except Exception:
                      continue
                  if msg.get('method') == 'Network.responseReceived':
                      p = msg.get('params', {})
                      response = p.get('response', {})
                      response_events.append({
                          'requestId': p.get('requestId'),
                          'url': response.get('url'),
                          'status': response.get('status'),
                          'mimeType': response.get('mimeType'),
                          'headers': response.get('headers', {}),
                      })
              Path('out/browser/responses.json').write_text(json.dumps(response_events, indent=2), encoding='utf-8')
              for i, event in enumerate(response_events):
                  mime = (event.get('mimeType') or '').lower()
                  url = event.get('url') or ''
                  if not any(x in mime for x in ['json','javascript','html','text']) and not any(x in url.lower() for x in ['api','course','material','search','4cp0']):
                      continue
                  try:
                      body = driver.execute_cdp_cmd('Network.getResponseBody', {'requestId': event['requestId']})
                      raw = body.get('body', '')
                      if body.get('base64Encoded'):
                          data = base64.b64decode(raw)
                      else:
                          data = raw.encode('utf-8', errors='replace')
                      if len(data) <= 8_000_000:
                          suffix = '.json' if 'json' in mime else '.txt'
                          (OUT/'network_bodies'/f'{i:04d}{suffix}').write_bytes(data)
                  except Exception as exc:
                      (OUT/'network_bodies'/f'{i:04d}.error.txt').write_text(repr(exc), encoding='utf-8')
          finally:
              driver.quit()

          session = requests.Session()
          session.headers.update({'User-Agent': UA, 'Referer': qualification, 'Accept': '*/*'})
          for cookie in json.loads(Path('out/browser/cookies.json').read_text(encoding='utf-8')):
              try:
                  session.cookies.set(cookie['name'], cookie['value'], domain=cookie.get('domain'), path=cookie.get('path','/'))
              except Exception:
                  pass

          # Search browser outputs and captured API bodies for package references and candidate URLs.
          url_re = re.compile(r'https?://[^\s"\'<>\\]+', re.I)
          candidate_urls = set()
          texts = []
          for p in list((OUT/'browser').glob('*')) + list((OUT/'network_bodies').glob('*')):
              if p.suffix.lower() in {'.png'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              texts.append(text)
              for u in url_re.findall(text):
                  u = u.replace('\\u0026','&').replace('\\/','/')
                  low = u.lower()
                  if '4cp0' in low or ('pearson' in low and ('material' in low or 'exam' in low)):
                      candidate_urls.add(u.rstrip('.,);]'))
          corpus = '\n'.join(texts)
          Path('out/browser/package_name_hits.txt').write_text('\n'.join(line for line in corpus.splitlines() if any(n.lower() in line.lower() for n in names)), encoding='utf-8')

          # Known official and plausible path/case variants.
          bases = [
              'https://qualifications.pearson.com/content/dam/secure/silver/all-uk-and-international/international-gcse/computer-science/2017/exam-materials/',
              'https://qualifications.pearson.com/content/dam/secure/silver/all-uk-and-international/international-gcse/computer-science/2017/Exam-materials/',
              'https://qualifications.pearson.com/content/dam/pdf/International%20GCSE/Computer%20Science/2017/Exam%20materials/',
              'https://qualifications.pearson.com/content/dam/pdf/International%20GCSE/Computer-science/2017/Exam-materials/',
              'https://www.exampaperspractice.co.uk/wp-content/uploads/',
              'https://exampaperspractice.co.uk/wp-content/uploads/',
          ]
          for base in bases:
              for name in names:
                  candidate_urls.add(base + name)
                  candidate_urls.add(base + name.upper())

          # Discover exact URLs in Common Crawl indexes and Wayback availability/CDX.
          index_queries = []
          try:
              coll = session.get('https://index.commoncrawl.org/collinfo.json', timeout=30)
              (OUT/'indexes'/'commoncrawl_collinfo.json').write_bytes(coll.content)
              indexes = [x['id'] for x in coll.json()[:6]]
          except Exception:
              indexes = ['CC-MAIN-2026-30','CC-MAIN-2026-26','CC-MAIN-2025-47']
          for name in names:
              for idx in indexes:
                  q = f'https://index.commoncrawl.org/{idx}-index?url=*%2F{name}&output=json&filter=status%3A200&collapse=urlkey'
                  index_queries.append(('commoncrawl', idx, name, q))
              official = bases[0] + name
              q = 'https://web.archive.org/cdx/search/cdx?url=' + urllib.parse.quote(official, safe='') + '&output=json&filter=statuscode:200&fl=timestamp,original,statuscode,mimetype,digest,length&collapse=digest'
              index_queries.append(('wayback_cdx','exact',name,q))
              q2 = 'https://archive.org/wayback/available?url=' + urllib.parse.quote(official, safe='')
              index_queries.append(('wayback_available','exact',name,q2))
          for kind, idx, name, q in index_queries:
              key = hashlib.sha256(q.encode()).hexdigest()[:12]
              try:
                  r = session.get(q, timeout=45)
                  payload = r.content
                  (OUT/'indexes'/f'{kind}_{idx}_{name}_{key}.txt').write_bytes(payload)
                  for line in payload.decode('utf-8', errors='ignore').splitlines():
                      try:
                          obj = json.loads(line)
                          if isinstance(obj, dict) and obj.get('url'):
                              candidate_urls.add(obj['url'])
                          if isinstance(obj, dict) and obj.get('archived_snapshots',{}).get('closest',{}).get('url'):
                              candidate_urls.add(obj['archived_snapshots']['closest']['url'])
                      except Exception:
                          pass
              except Exception as exc:
                  (OUT/'indexes'/f'{kind}_{idx}_{name}_{key}.error.txt').write_text(repr(exc), encoding='utf-8')

          Path('out/candidate_urls.txt').write_text('\n'.join(sorted(candidate_urls)), encoding='utf-8')

          results = []
          def safe_name(url, i):
              tail = urllib.parse.urlsplit(url).path.rsplit('/',1)[-1] or f'candidate_{i}'
              tail = re.sub(r'[^A-Za-z0-9._-]+','_',tail)[:160]
              return f'{i:04d}_{tail}'

          # Probe only likely package URLs and exact target names; preserve response evidence.
          probe_urls = []
          for u in sorted(candidate_urls):
              low = u.lower()
              if any(n in low for n in [x.lower() for x in names]) or ('4cp0' in low and ('.zip' in low or 'exam-materials' in low)):
                  probe_urls.append(u)
          for i, url in enumerate(probe_urls):
              item = {'url': url}
              fname = safe_name(url, i)
              try:
                  r = session.get(url, allow_redirects=True, timeout=90, stream=True)
                  data = bytearray()
                  for chunk in r.iter_content(1024*1024):
                      if chunk:
                          data.extend(chunk)
                      if len(data) > 120_000_000:
                          raise RuntimeError('response exceeds 120 MB limit')
                  blob = bytes(data)
                  sha = hashlib.sha256(blob).hexdigest()
                  item.update({'status': r.status_code, 'final_url': r.url, 'bytes': len(blob), 'sha256': sha, 'content_type': r.headers.get('content-type'), 'content_disposition': r.headers.get('content-disposition')})
                  evidence = OUT/'probes'/fname
                  if blob.startswith(b'PK'):
                      evidence = evidence.with_suffix('.zip')
                      evidence.write_bytes(blob)
                      valid = False
                      members = []
                      error = None
                      try:
                          with zipfile.ZipFile(evidence) as z:
                              members = z.namelist()
                              error = z.testzip()
                              valid = error is None
                      except Exception as exc:
                          error = repr(exc)
                      item.update({'zip_magic': True, 'zip_valid': valid, 'zip_test_error': error, 'members': members})
                      if valid:
                          target = OUT/'valid_packages'/Path(urllib.parse.urlsplit(r.url).path).name
                          if not target.name.lower().endswith('.zip'):
                              target = OUT/'valid_packages'/Path(url).name
                          target.write_bytes(blob)
                  else:
                      evidence = evidence.with_suffix('.bin')
                      evidence.write_bytes(blob[:2_000_000])
                      item.update({'zip_magic': False, 'prefix_hex': blob[:32].hex(), 'text_prefix': blob[:500].decode('utf-8', errors='replace')})
              except Exception as exc:
                  item['error'] = repr(exc)
              results.append(item)
          Path('out/probe_results.json').write_text(json.dumps(results, indent=2), encoding='utf-8')

          valid = [x for x in results if x.get('zip_valid')]
          summary = {
              'qualification_url': qualification,
              'target_names': names,
              'browser_responses': len(response_events),
              'candidate_url_count': len(candidate_urls),
              'probe_count': len(results),
              'valid_zip_count': len(valid),
              'valid_zips': valid,
          }
          Path('out/SUMMARY.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
          python /tmp/discover.py
          find out -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearson-4cp0-2025-paper2-deep-discovery
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
