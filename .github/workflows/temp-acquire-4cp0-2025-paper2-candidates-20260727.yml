name: Temporary acquire Pearson 4CP0 2025 Paper 2 candidates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install validators
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils unzip

      - name: Discover and acquire candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/api out/files
          base='https://www.exampaperspractice.co.uk'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'

          for term in 20250821 4cp0-2a-rms 4cp0-2b-rms 4cp0-2c-rms 4cp0-2aw-rms 4cp0-2bw-rms 4cp0-2cw-rms; do
            enc=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$term")
            curl --fail --location --max-time 45 -A "$ua" "$base/wp-json/wp/v2/media?search=$enc&per_page=100" -o "out/api/$term.json" || echo '[]' > "out/api/$term.json"
          done

          cat > out/candidate_names.txt <<'EOF'
          4cp0-2aw-que-20250605.pdf
          4cp0-2bw-que-20250605.pdf
          4cp0-2cw-que-20250605.pdf
          4cp0-2a-rms-20250821.pdf
          4cp0-2b-rms-20250821.pdf
          4cp0-2c-rms-20250821.pdf
          4cp0-2aw-rms-20250821.pdf
          4cp0-2bw-rms-20250821.pdf
          4cp0-2cw-rms-20250821.pdf
          4cp0-02-que-20250605.zip
          4cp0-02-rms-20250821.zip
          EOF

          : > out/results.tsv
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            url="$base/wp-content/uploads/$name"
            dest="out/files/$name"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -A "$ua" "$url" -o "$dest"; then
              size=$(stat -c%s "$dest")
              sig=$(head -c 5 "$dest" | xxd -p)
              valid=no
              if [[ "$name" == *.pdf ]] && [[ "$(head -c 5 "$dest")" == '%PDF-' ]] && pdfinfo "$dest" >/dev/null 2>&1; then valid=yes; fi
              if [[ "$name" == *.zip ]] && [[ "$(head -c 2 "$dest")" == 'PK' ]] && unzip -t "$dest" >/dev/null 2>&1; then valid=yes; fi
              sha=$(sha256sum "$dest" | awk '{print $1}')
              printf '%s\tHTTP_OK\t%s\t%s\t%s\t%s\n' "$name" "$size" "$sig" "$valid" "$sha" >> out/results.tsv
              [[ "$valid" == yes ]] || rm -f "$dest"
            else
              printf '%s\tHTTP_FAIL\t0\t-\tno\t-\n' "$name" >> out/results.tsv
              rm -f "$dest"
            fi
          done < out/candidate_names.txt

          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('out/api').glob('*.json')):
              try: data=json.loads(p.read_text('utf-8'))
              except Exception: data=[]
              for item in data if isinstance(data,list) else []:
                  blob=' '.join(str(x) for x in [item.get('slug'),item.get('source_url'),item.get('filename'),(item.get('title') or {}).get('rendered')]).lower()
                  if '4cp0' in blob:
                      rows.append({'query':p.stem,'id':item.get('id'),'date':item.get('date'),'slug':item.get('slug'),'mime_type':item.get('mime_type'),'source_url':item.get('source_url'),'filesize':item.get('filesize')})
          Path('out/api_candidates.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print(json.dumps(rows,indent=2))
          print(Path('out/results.tsv').read_text())
          PY

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearson-4cp0-2025-paper2-candidates
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
