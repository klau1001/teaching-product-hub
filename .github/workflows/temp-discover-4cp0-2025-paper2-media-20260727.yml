name: Temporary discover Pearson 4CP0 2025 Paper 2 media

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Discover public WordPress media candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          base = 'https://www.exampaperspractice.co.uk'
          page_url = base + '/igcse/sciences/computer-science/edexcel-igcse-computer-science-4pc0-past-papers/'
          headers = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read(), dict(r.headers), r.status

          report = {'page_url': page_url, 'page_candidates': [], 'media_searches': {}, 'sitemap_candidates': [], 'errors': []}

          try:
              body, hdr, status = get(page_url)
              text = body.decode('utf-8', 'replace')
              Path('out/page.html').write_text(text, encoding='utf-8')
              urls = set(re.findall(r'https?://[^\"\'<>\\s]+', html.unescape(text)))
              for u in sorted(urls):
                  lu = u.lower()
                  if 'wp-content/uploads' in lu and any(k in lu for k in ['4cp0','p2','2aw','2bw','2cw','2025','2506']):
                      report['page_candidates'].append(u)
          except Exception as e:
              report['errors'].append({'stage': 'page', 'error': repr(e)})

          terms = ['4cp0', '2aw', '2bw', '2cw', 'paper 2', 'application computational thinking', '2025', '2506', 'P2 QP', 'P2 MS']
          for term in terms:
              found = []
              for page in range(1, 6):
                  url = base + '/wp-json/wp/v2/media?' + urllib.parse.urlencode({'search': term, 'per_page': 100, 'page': page})
                  try:
                      body, hdr, status = get(url)
                      data = json.loads(body.decode('utf-8'))
                      if not isinstance(data, list) or not data:
                          break
                      for item in data:
                          src = item.get('source_url')
                          title = html.unescape((item.get('title') or {}).get('rendered',''))
                          slug = item.get('slug')
                          mime = item.get('mime_type')
                          desc = html.unescape((item.get('description') or {}).get('rendered',''))
                          blob = ' '.join(map(str,[src,title,slug,mime,desc])).lower()
                          if any(k in blob for k in ['4cp0','2aw','2bw','2cw','paper 2','computational thinking','p2_','p2-','2025','2506']):
                              found.append({'id': item.get('id'), 'date': item.get('date'), 'slug': slug, 'title': title, 'mime_type': mime, 'source_url': src})
                      if len(data) < 100:
                          break
                  except Exception as e:
                      report['errors'].append({'stage': 'media', 'term': term, 'page': page, 'error': repr(e)})
                      break
              report['media_searches'][term] = found

          sitemap_urls = [base + '/wp-sitemap.xml', base + '/wp-sitemap-posts-attachment-1.xml']
          seen = set()
          for su in sitemap_urls:
              try:
                  body, hdr, status = get(su)
                  text = body.decode('utf-8','replace')
                  Path('out/' + su.rsplit('/',1)[-1]).write_text(text, encoding='utf-8')
                  for u in re.findall(r'<loc>(.*?)</loc>', text, flags=re.I|re.S):
                      u = html.unescape(u.strip())
                      if any(k in u.lower() for k in ['4cp0','2aw','2bw','2cw','paper-2','p2-','p2_','2025','2506']):
                          seen.add(u)
              except Exception as e:
                  report['errors'].append({'stage': 'sitemap', 'url': su, 'error': repr(e)})
          report['sitemap_candidates'] = sorted(seen)

          Path('out/discovery.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearson-4cp0-2025-paper2-media-discovery
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
