name: Temporary publish 0478 Batch 01 completion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat \
            tmp/upee_0478_s25_22_batch01_response_space_mapping_r1.zip.b64 \
            tmp/upee_0478_s25_22_batch01_response_space_mapping_r1.zip.b64.part01 \
            tmp/upee_0478_s25_22_batch01_response_space_mapping_r1.zip.b64.part02 \
            tmp/upee_0478_s25_22_batch01_response_space_mapping_r1.zip.b64.part03 \
            tmp/upee_0478_s25_22_batch01_response_space_mapping_r1.zip.b64.part04 \
            tmp/upee_0478_s25_22_batch01_response_space_mapping_r1.zip.b64.part05 \
            tmp/upee_0478_s25_22_batch01_response_space_mapping_r1.zip.b64.part06 \
            > out/package.zip.b64
          test "$(stat -c%s out/package.zip.b64)" -eq 25672
          base64 -d out/package.zip.b64 > out/UPEE_0478_S25_22_BATCH01_RESPONSE_SPACE_MAPPING_R1.zip
          test "$(stat -c%s out/UPEE_0478_S25_22_BATCH01_RESPONSE_SPACE_MAPPING_R1.zip)" -eq 19252
          echo '02bb45154993c77c8d09b3d072977f097364f2231a8e85ff8dcf0088827762af  out/UPEE_0478_S25_22_BATCH01_RESPONSE_SPACE_MAPPING_R1.zip' | sha256sum -c -
          unzip -t out/UPEE_0478_S25_22_BATCH01_RESPONSE_SPACE_MAPPING_R1.zip
          unzip -q out/UPEE_0478_S25_22_BATCH01_RESPONSE_SPACE_MAPPING_R1.zip -d out/unpacked
          test "$(find out/unpacked -type f | wc -l)" -eq 14
      - name: Upload package and unpacked operational files
        uses: actions/upload-artifact@v4
        with:
          name: upee-0478-s25-22-batch01-response-space-mapping-r1
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
