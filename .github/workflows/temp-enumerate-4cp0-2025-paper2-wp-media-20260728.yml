name: Temporary enumerate Pearson 4CP0 2025 Paper 2 mirror media

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install validators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils unzip
          python -m pip install --quiet requests

      - name: Enumerate date window, searches and candidate binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/meta out/files out/text
          cat > /tmp/enumerate.py <<'PY'
          import hashlib
          import json
          import re
          import urllib.parse
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          OUT=Path('out')
          BASE='https://www.exampaperspractice.co.uk'
          API=BASE+'/wp-json/wp/v2/media'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept':'application/json,*/*'})

          items={}
          calls=[]
          def add_results(label, params):
              page=1
              while page<=20:
                  q=dict(params); q.update({'per_page':100,'page':page})
                  try:
                      r=s.get(API,params=q,timeout=45)
                      calls.append({'label':label,'page':page,'url':r.url,'status':r.status_code,'total':r.headers.get('X-WP-Total'),'total_pages':r.headers.get('X-WP-TotalPages'),'bytes':len(r.content)})
                      if r.status_code==400 and page>1: break
                      r.raise_for_status()
                      data=r.json()
                      if not isinstance(data,list) or not data: break
                      for item in data:
                          items[item['id']]=item
                      total_pages=int(r.headers.get('X-WP-TotalPages') or 1)
                      if page>=total_pages: break
                      page+=1
                  except Exception as e:
                      calls.append({'label':label,'page':page,'error':repr(e)})
                      break

          # Known batch was uploaded at 2026-05-23 10:08 UTC. Enumerate a tight window plus broad fallback.
          add_results('tight_window', {'after':'2026-05-23T09:00:00','before':'2026-05-23T11:30:00','orderby':'date','order':'asc'})
          add_results('day_window', {'after':'2026-05-23T00:00:00','before':'2026-05-24T00:00:00','orderby':'date','order':'asc'})
          terms=['4cp0','P2_MS','P2_QP','2a-rms','2b-rms','2c-rms','2aw','2bw','2cw','CODES','data files','data-files-4cp0','june 2025','177744584']
          for term in terms:
              add_results('search_'+term, {'search':term,'orderby':'date','order':'desc'})

          (OUT/'api_calls.json').write_text(json.dumps(calls,indent=2),encoding='utf-8')
          normalized=[]
          for mid,item in sorted(items.items()):
              rec={
                'id':mid,'date':item.get('date'),'modified':item.get('modified'),'slug':item.get('slug'),
                'title':(item.get('title') or {}).get('rendered'),'caption':(item.get('caption') or {}).get('rendered'),
                'description':(item.get('description') or {}).get('rendered'),'mime_type':item.get('mime_type'),
                'source_url':item.get('source_url'),'link':item.get('link'),'post':item.get('post'),
              }
              normalized.append(rec)
              (OUT/'meta'/f'{mid}.json').write_text(json.dumps(item,indent=2),encoding='utf-8')
          (OUT/'media_inventory.json').write_text(json.dumps(normalized,indent=2),encoding='utf-8')

          keywords=('4cp0','p2_','paper 2','2aw','2bw','2cw','2a','2b','2c','codes','data file','computer science','177744584')
          candidates=[]
          for rec in normalized:
              blob=' '.join(str(rec.get(k) or '') for k in ('slug','title','caption','description','source_url')).lower()
              # Tight-window files are included even if opaque; broader results require a keyword.
              tight=(rec.get('date') or '').startswith('2026-05-23T10:')
              if tight or any(k in blob for k in keywords):
                  candidates.append(rec)
          (OUT/'candidate_inventory.json').write_text(json.dumps(candidates,indent=2),encoding='utf-8')

          results=[]
          for rec in candidates:
              url=rec.get('source_url') or ''
              mime=(rec.get('mime_type') or '').lower()
              if not url or not (mime in ('application/pdf','application/zip','application/x-zip-compressed','application/octet-stream') or url.lower().endswith(('.pdf','.zip','.rar'))):
                  continue
              row={'id':rec['id'],'slug':rec.get('slug'),'date':rec.get('date'),'mime_type':mime,'url':url}
              try:
                  r=s.get(url,allow_redirects=True,timeout=120)
                  data=r.content
                  row.update({'status':r.status_code,'final_url':r.url,'bytes':len(data),'content_type':r.headers.get('content-type'),'sha256':hashlib.sha256(data).hexdigest(),'prefix_hex':data[:16].hex()})
                  suffix='.pdf' if data.startswith(b'%PDF-') else '.zip' if data.startswith(b'PK') else '.bin'
                  safe=re.sub(r'[^A-Za-z0-9._-]+','_',f"{rec['id']}_{rec.get('slug') or 'asset'}")[:180]
                  path=OUT/'files'/(safe+suffix); path.write_bytes(data)
                  if suffix=='.pdf':
                      import subprocess
                      subprocess.run(['pdfinfo',str(path)],stdout=open(OUT/'text'/(safe+'.pdfinfo.txt'),'w'),stderr=subprocess.STDOUT,check=False)
                      subprocess.run(['pdftotext','-f','1','-l','4','-layout',str(path),str(OUT/'text'/(safe+'.txt'))],check=False)
                      text=(OUT/'text'/(safe+'.txt')).read_text(encoding='utf-8',errors='ignore') if (OUT/'text'/(safe+'.txt')).exists() else ''
                      row['first_text']=text[:4000]
                  elif suffix=='.zip':
                      valid=False; members=[]; err=None
                      try:
                          with zipfile.ZipFile(path) as z:
                              members=z.namelist(); err=z.testzip(); valid=err is None
                      except Exception as e: err=repr(e)
                      row.update({'zip_valid':valid,'zip_test_error':err,'members':members})
              except Exception as e:
                  row['error']=repr(e)
              results.append(row)
          (OUT/'download_results.json').write_text(json.dumps(results,indent=2),encoding='utf-8')

          relevant=[]
          for r in results:
              text=(r.get('first_text') or '').lower()
              if '4cp0' in text or 'computer science' in text or r.get('zip_valid'):
                  relevant.append(r)
          summary={'unique_media_items':len(normalized),'candidate_items':len(candidates),'downloaded_items':len(results),'relevant_validated_items':len(relevant),'valid_zips':sum(1 for r in results if r.get('zip_valid')),'relevant':relevant}
          (OUT/'SUMMARY.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
          python /tmp/enumerate.py
          find out -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort

      - name: Upload enumeration artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearson-4cp0-2025-paper2-mirror-media-enumeration
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
