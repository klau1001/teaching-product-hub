name: Temporary CS past-paper acquisition

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and validate source files
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/0478/2025/march out/0478/2025/may-june out/0478/2025/oct-nov out/4CP0/2025/june
          printf 'status\tboard\tsession\tfilename\tsize\tsha256\turl\n' > out/acquisition_status.tsv

          download_pdf() {
            local board="$1" session="$2" dir="$3" name="$4" url="$5"
            local tmp="$dir/$name.part" dst="$dir/$name"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
              -o "$tmp" "$url"; then
              if head -c 5 "$tmp" | grep -q '%PDF-' && [ "$(stat -c%s "$tmp")" -gt 10000 ]; then
                mv "$tmp" "$dst"
                printf 'PASS\t%s\t%s\t%s\t%s\t%s\t%s\n' "$board" "$session" "$name" "$(stat -c%s "$dst")" "$(sha256sum "$dst" | cut -d' ' -f1)" "$url" >> out/acquisition_status.tsv
              else
                printf 'FAIL_INVALID_PDF\t%s\t%s\t%s\t%s\t-\t%s\n' "$board" "$session" "$name" "$(stat -c%s "$tmp" 2>/dev/null || echo 0)" "$url" >> out/acquisition_status.tsv
                rm -f "$tmp"
              fi
            else
              printf 'FAIL_DOWNLOAD\t%s\t%s\t%s\t0\t-\t%s\n' "$board" "$session" "$name" "$url" >> out/acquisition_status.tsv
              rm -f "$tmp"
            fi
          }

          download_zip() {
            local board="$1" session="$2" dir="$3" name="$4" url="$5"
            local tmp="$dir/$name.part" dst="$dir/$name"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
              -o "$tmp" "$url"; then
              if unzip -tq "$tmp" >/dev/null 2>&1 && [ "$(stat -c%s "$tmp")" -gt 1000 ]; then
                mv "$tmp" "$dst"
                printf 'PASS\t%s\t%s\t%s\t%s\t%s\t%s\n' "$board" "$session" "$name" "$(stat -c%s "$dst")" "$(sha256sum "$dst" | cut -d' ' -f1)" "$url" >> out/acquisition_status.tsv
              else
                printf 'FAIL_INVALID_ZIP\t%s\t%s\t%s\t%s\t-\t%s\n' "$board" "$session" "$name" "$(stat -c%s "$tmp" 2>/dev/null || echo 0)" "$url" >> out/acquisition_status.tsv
                rm -f "$tmp"
              fi
            else
              printf 'FAIL_DOWNLOAD\t%s\t%s\t%s\t0\t-\t%s\n' "$board" "$session" "$name" "$url" >> out/acquisition_status.tsv
              rm -f "$tmp"
            fi
          }

          base='https://xtrapapers.co/papers/caie/igcse/computer-science-0478'
          for f in 0478_m25_qp_12.pdf 0478_m25_ms_12.pdf 0478_m25_qp_22.pdf 0478_m25_ms_22.pdf; do
            download_pdf Cambridge 'March 2025' out/0478/2025/march "$f" "$base/2025-march/$f/download"
          done
          for f in 0478_s25_qp_11.pdf 0478_s25_ms_11.pdf 0478_s25_qp_12.pdf 0478_s25_ms_12.pdf 0478_s25_qp_13.pdf 0478_s25_ms_13.pdf 0478_s25_qp_21.pdf 0478_s25_ms_21.pdf 0478_s25_qp_22.pdf 0478_s25_ms_22.pdf 0478_s25_qp_23.pdf 0478_s25_ms_23.pdf; do
            download_pdf Cambridge 'May-June 2025' out/0478/2025/may-june "$f" "$base/2025-may-june/$f/download"
          done
          for f in 0478_w25_qp_11.pdf 0478_w25_ms_11.pdf 0478_w25_qp_12.pdf 0478_w25_ms_12.pdf 0478_w25_qp_13.pdf 0478_w25_ms_13.pdf 0478_w25_qp_21.pdf 0478_w25_ms_21.pdf 0478_w25_qp_22.pdf 0478_w25_ms_22.pdf 0478_w25_qp_23.pdf 0478_w25_ms_23.pdf; do
            download_pdf Cambridge 'October-November 2025' out/0478/2025/oct-nov "$f" "$base/2025-oct-nov/$f/download"
          done

          pbase='https://qualifications.pearson.com/content/dam/secure/silver/all-uk-and-international/international-gcse/computer-science/2017/exam-materials'
          download_pdf Pearson 'June 2025' out/4CP0/2025/june '4cp0-01-que-20250510.pdf' "$pbase/4cp0-01-que-20250510.pdf"
          download_pdf Pearson 'June 2025' out/4CP0/2025/june '4cp0-01-rms-20250821.pdf' "$pbase/4cp0-01-rms-20250821.pdf"
          download_zip Pearson 'June 2025' out/4CP0/2025/june '4cp0-02-que-20250605.zip' "$pbase/4cp0-02-que-20250605.zip"
          download_zip Pearson 'June 2025' out/4CP0/2025/june '4cp0-02-rms-20250821.zip' "$pbase/4cp0-02-rms-20250821.zip"

          find out -type f ! -name acquisition_status.tsv -print0 | sort -z | xargs -0 -r sha256sum > out/SHA256SUMS.txt
          echo '--- acquisition status ---'
          column -ts $'\t' out/acquisition_status.tsv || cat out/acquisition_status.tsv
          echo 'PASS count:' "$(awk -F '\t' 'NR>1 && $1=="PASS"{n++} END{print n+0}' out/acquisition_status.tsv)"
          echo 'FAIL count:' "$(awk -F '\t' 'NR>1 && $1!="PASS"{n++} END{print n+0}' out/acquisition_status.tsv)"

      - name: Upload acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-pastpapers-2025
          path: out/
          if-no-files-found: error
          retention-days: 1
