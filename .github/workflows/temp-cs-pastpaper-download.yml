name: Temporary Pearson 4CP0 acquisition diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe Pearson public and secure routes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/valid out/diagnostic
          landing='https://qualifications.pearson.com/en/qualifications/edexcel-international-gcses/international-gcse-computer-science-2017.coursematerials.html'
          curl -L --max-time 120 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -c out/cookies.txt -o out/landing.html "$landing" || true
          printf 'status\tfilename\tsize\tsha256\turl\n' > out/probe_status.tsv

          probe() {
            local name="$1" kind="$2" url="$3" tag="$4"
            local body="out/diagnostic/${name}.${tag}.body"
            local hdr="out/diagnostic/${name}.${tag}.headers"
            curl -L --retry 2 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
              -H 'Accept: application/pdf,application/zip,application/octet-stream;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: en-GB,en;q=0.9' \
              -H "Referer: $landing" -b out/cookies.txt -c out/cookies.txt \
              -D "$hdr" -o "$body" "$url" || true
            local size=0; [ -f "$body" ] && size=$(stat -c%s "$body")
            local ok=0
            if [ "$kind" = pdf ] && [ -f "$body" ] && head -c 5 "$body" | grep -q '%PDF-' && [ "$size" -gt 10000 ]; then ok=1; fi
            if [ "$kind" = zip ] && [ -f "$body" ] && unzip -tq "$body" >/dev/null 2>&1 && [ "$size" -gt 1000 ]; then ok=1; fi
            if [ "$ok" = 1 ]; then
              cp "$body" "out/valid/$name"
              printf 'PASS\t%s\t%s\t%s\t%s\n' "$name" "$size" "$(sha256sum "$body" | cut -d' ' -f1)" "$url" >> out/probe_status.tsv
            else
              printf 'FAIL\t%s\t%s\t-\t%s\n' "$name" "$size" "$url" >> out/probe_status.tsv
              file "$body" > "out/diagnostic/${name}.${tag}.file.txt" 2>&1 || true
              head -c 2000 "$body" > "out/diagnostic/${name}.${tag}.preview.txt" 2>/dev/null || true
            fi
          }

          pub1='https://qualifications.pearson.com/content/dam/pdf/International-GCSE/Computer-science/2017/Exam-materials'
          pub2='https://qualifications.pearson.com/content/dam/pdf/International%20GCSE/computer-science/2017/Exam-materials'
          sec='https://qualifications.pearson.com/content/dam/secure/silver/all-uk-and-international/international-gcse/computer-science/2017/exam-materials'

          for candidate in 4cp0-01-que-20250509.pdf 4cp0-01-que-20250510.pdf; do
            probe '4cp0-01-que-20250509.pdf' pdf "$pub1/$candidate" "pub1-${candidate}"
            probe '4cp0-01-que-20250509.pdf' pdf "$pub2/$candidate" "pub2-${candidate}"
            probe '4cp0-01-que-20250509.pdf' pdf "$sec/$candidate" "secure-${candidate}"
          done
          for candidate in 4cp0-01-rms-20250821.pdf 4cp0-01-rms-20250826.pdf; do
            probe '4cp0-01-rms-20250821.pdf' pdf "$pub1/$candidate" "pub1-${candidate}"
            probe '4cp0-01-rms-20250821.pdf' pdf "$pub2/$candidate" "pub2-${candidate}"
            probe '4cp0-01-rms-20250821.pdf' pdf "$sec/$candidate" "secure-${candidate}"
          done
          for candidate in 4cp0-02-que-20250605.zip 4cp0-02-que-20250610.zip; do
            probe '4cp0-02-que-20250605.zip' zip "$pub1/$candidate" "pub1-${candidate}"
            probe '4cp0-02-que-20250605.zip' zip "$pub2/$candidate" "pub2-${candidate}"
            probe '4cp0-02-que-20250605.zip' zip "$sec/$candidate" "secure-${candidate}"
          done
          for candidate in 4cp0-02-rms-20250821.zip 4cp0-02-rms-20250826.zip; do
            probe '4cp0-02-rms-20250821.zip' zip "$pub1/$candidate" "pub1-${candidate}"
            probe '4cp0-02-rms-20250821.zip' zip "$pub2/$candidate" "pub2-${candidate}"
            probe '4cp0-02-rms-20250821.zip' zip "$sec/$candidate" "secure-${candidate}"
          done
          cat out/probe_status.tsv

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearson-4cp0-2025-diagnostic
          path: out/
          if-no-files-found: error
          retention-days: 1
