name: Temporary Cambridge 0478 2023-2024 acquisition

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download and validate Cambridge 0478 source files
        shell: bash
        run: |
          set -uo pipefail
          for year in 2023 2024; do
            mkdir -p "out/0478/$year/march" "out/0478/$year/may-june" "out/0478/$year/oct-nov"
          done
          printf 'status\tyear\tsession\tfilename\tsize\tsha256\turl\n' > out/acquisition_status.tsv

          download_pdf() {
            local year="$1" session="$2" dir="$3" name="$4" url="$5"
            local tmp="$dir/$name.part" dst="$dir/$name"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
              -o "$tmp" "$url"; then
              if head -c 5 "$tmp" | grep -q '%PDF-' && [ "$(stat -c%s "$tmp")" -gt 10000 ]; then
                mv "$tmp" "$dst"
                printf 'PASS\t%s\t%s\t%s\t%s\t%s\t%s\n' "$year" "$session" "$name" "$(stat -c%s "$dst")" "$(sha256sum "$dst" | cut -d' ' -f1)" "$url" >> out/acquisition_status.tsv
              else
                printf 'FAIL_INVALID_PDF\t%s\t%s\t%s\t%s\t-\t%s\n' "$year" "$session" "$name" "$(stat -c%s "$tmp" 2>/dev/null || echo 0)" "$url" >> out/acquisition_status.tsv
                rm -f "$tmp"
              fi
            else
              printf 'FAIL_DOWNLOAD\t%s\t%s\t%s\t0\t-\t%s\n' "$year" "$session" "$name" "$url" >> out/acquisition_status.tsv
              rm -f "$tmp"
            fi
          }

          base='https://xtrapapers.co/papers/caie/igcse/computer-science-0478'
          for y in 23 24; do
            year="20$y"
            for f in "0478_m${y}_qp_12.pdf" "0478_m${y}_ms_12.pdf" "0478_m${y}_qp_22.pdf" "0478_m${y}_ms_22.pdf"; do
              download_pdf "$year" "March $year" "out/0478/$year/march" "$f" "$base/${year}-march/$f/download"
            done
            for c in 11 12 13 21 22 23; do
              for kind in qp ms; do
                f="0478_s${y}_${kind}_${c}.pdf"
                download_pdf "$year" "May-June $year" "out/0478/$year/may-june" "$f" "$base/${year}-may-june/$f/download"
              done
            done
            for c in 11 12 13 21 22 23; do
              for kind in qp ms; do
                f="0478_w${y}_${kind}_${c}.pdf"
                download_pdf "$year" "October-November $year" "out/0478/$year/oct-nov" "$f" "$base/${year}-oct-nov/$f/download"
              done
            done
          done

          find out -type f -name '*.pdf' -print0 | sort -z | xargs -0 -r sha256sum > out/SHA256SUMS.txt
          echo '--- acquisition status ---'
          column -ts $'\t' out/acquisition_status.tsv || cat out/acquisition_status.tsv
          pass=$(awk -F '\t' 'NR>1 && $1=="PASS"{n++} END{print n+0}' out/acquisition_status.tsv)
          fail=$(awk -F '\t' 'NR>1 && $1!="PASS"{n++} END{print n+0}' out/acquisition_status.tsv)
          echo "PASS count: $pass"
          echo "FAIL count: $fail"
          test "$pass" -eq 56
          test "$fail" -eq 0

      - name: Upload acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-0478-2023-2024
          path: out/
          if-no-files-found: error
          retention-days: 1
