name: Temporary Pearson 4CP0 2023-2024 acquisition

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and validate Pearson 4CP0 source files
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/4CP0/2024/june out/4CP0/2023/june out/diagnostic
          printf 'status\tyear\tfilename\tsize\tsha256\turl\n' > out/acquisition_status.tsv
          base='https://qualifications.pearson.com/content/dam/pdf/International-GCSE/Computer-science/2017/Exam-materials'

          fetch_one() {
            local year="$1" name="$2" kind="$3" required="$4"
            local dir="out/4CP0/$year/june" tmp="$dir/$name.part" dst="$dir/$name" url="$base/$name"
            if curl -fL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' -o "$tmp" "$url"; then
              local size; size=$(stat -c%s "$tmp")
              local ok=0
              if [ "$kind" = pdf ] && head -c 5 "$tmp" | grep -q '%PDF-' && [ "$size" -gt 10000 ]; then ok=1; fi
              if [ "$kind" = zip ] && unzip -tq "$tmp" >/dev/null 2>&1 && [ "$size" -gt 1000 ]; then ok=1; fi
              if [ "$ok" = 1 ]; then
                mv "$tmp" "$dst"
                printf 'PASS\t%s\t%s\t%s\t%s\t%s\n' "$year" "$name" "$size" "$(sha256sum "$dst" | cut -d' ' -f1)" "$url" >> out/acquisition_status.tsv
              else
                printf 'FAIL_INVALID_%s\t%s\t%s\t%s\t-\t%s\n' "${kind^^}" "$year" "$name" "$size" "$url" >> out/acquisition_status.tsv
                mv "$tmp" "out/diagnostic/${year}_${name}.invalid" 2>/dev/null || true
              fi
            else
              printf 'FAIL_DOWNLOAD\t%s\t%s\t0\t-\t%s\n' "$year" "$name" "$url" >> out/acquisition_status.tsv
              rm -f "$tmp"
            fi
          }

          # 2024: four confirmed official PDFs.
          fetch_one 2024 '4cp0-01-que-20240524.pdf' pdf required
          fetch_one 2024 '4cp0-01-rms-20240822.pdf' pdf required
          fetch_one 2024 '4cp0-02-que-20240613.pdf' pdf required
          fetch_one 2024 '4cp0-02-rms-20240822.pdf' pdf required
          # Probe possible official data/package objects without promoting invalid responses.
          fetch_one 2024 '4cp0-02-que-20240613.zip' zip optional
          fetch_one 2024 '4cp0-02-data-20240613.zip' zip optional

          # 2023: Paper 1 and Paper 2A confirmed official PDFs.
          fetch_one 2023 '4cp0-01-que-20230527.pdf' pdf required
          fetch_one 2023 '4cp0-01-rms-20230824.pdf' pdf required
          fetch_one 2023 '4cp0-2a-que-20230608.pdf' pdf required
          fetch_one 2023 '4cp0-2a-rms-20230824.pdf' pdf required
          # Probe language variants and supplied-file packages.
          fetch_one 2023 '4cp0-2b-que-20230608.pdf' pdf optional
          fetch_one 2023 '4cp0-2b-rms-20230824.pdf' pdf optional
          fetch_one 2023 '4cp0-2c-que-20230608.pdf' pdf optional
          fetch_one 2023 '4cp0-2c-rms-20230824.pdf' pdf optional
          fetch_one 2023 '4cp0-2a-que-20230608.zip' zip optional
          fetch_one 2023 '4cp0-2b-que-20230608.zip' zip optional
          fetch_one 2023 '4cp0-2c-que-20230608.zip' zip optional

          find out/4CP0 -type f ! -name '*.part' -print0 | sort -z | xargs -0 -r sha256sum > out/SHA256SUMS.txt
          cat out/acquisition_status.tsv
          required_pass=$(awk -F '\t' 'NR>1 && $1=="PASS" && (($2=="2024" && $3 ~ /^4cp0-0[12]-(que|rms)/) || ($2=="2023" && ($3 ~ /^4cp0-01-(que|rms)/ || $3 ~ /^4cp0-2a-(que|rms)/))){n++} END{print n+0}' out/acquisition_status.tsv)
          echo "Required confirmed PDF PASS count: $required_pass"
          test "$required_pass" -eq 8

      - name: Upload acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearson-4cp0-2023-2024
          path: out/
          if-no-files-found: error
          retention-days: 1
