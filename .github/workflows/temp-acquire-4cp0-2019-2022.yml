name: Temporary acquire Pearson 4CP0 2019-2022

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download candidate original PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/2019 out/2020 out/2021_June out/2021_November out/2022
          p1='https://pmt.physicsandmathstutor.com/download/Computer-Science/GCSE/Past-Papers/Edexcel-IGCSE/Paper-1'
          p2='https://pmt.physicsandmathstutor.com/download/Computer-Science/GCSE/Past-Papers/Edexcel-IGCSE/Paper-2'

          get() {
            local url="$1" dest="$2"
            echo "Downloading $dest"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' "$url" -o "$dest"
            test "$(head -c 5 "$dest")" = '%PDF-'
            test "$(stat -c%s "$dest")" -gt 10000
          }

          get "$p1/June%202019%20QP%20-%20Paper%201%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2019/June_2019_QP_Paper_1.pdf
          get "$p1/June%202019%20MS%20-%20Paper%201%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2019/June_2019_MS_Paper_1.pdf
          get "$p2/June%202019%20QP%20-%20Paper%202%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2019/June_2019_QP_Paper_2.pdf
          get "$p2/June%202019%20MS%20-%20Paper%202%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2019/June_2019_MS_Paper_2.pdf

          get "$p1/June%202020%20QP%20-%20Paper%201%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2020/June_2020_QP_Paper_1.pdf
          get "$p1/June%202020%20MS%20-%20Paper%201%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2020/June_2020_MS_Paper_1.pdf
          get "$p2/June%202020%20QP%20-%20Paper%202%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2020/June_2020_QP_Paper_2.pdf
          get "$p2/June%202020%20MS%20-%20Paper%202A%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2020/June_2020_MS_Paper_2A.pdf
          get "$p2/June%202020%20MS%20-%20Paper%202B%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2020/June_2020_MS_Paper_2B.pdf
          get "$p2/June%202020%20MS%20-%20Paper%202C%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2020/June_2020_MS_Paper_2C.pdf

          get "$p1/June%202021%20QP%20-%20Paper%201%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2021_June/June_2021_QP_Paper_1.pdf
          get "$p1/June%202021%20MS%20-%20Paper%201%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2021_June/June_2021_MS_Paper_1.pdf
          get "$p2/June%202021%20QP%20-%20Paper%202%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2021_June/June_2021_QP_Paper_2.pdf
          get "$p2/June%202021%20MS%20-%20Paper%202A%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2021_June/June_2021_MS_Paper_2A.pdf
          get "$p2/June%202021%20MS%20-%20Paper%202B%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2021_June/June_2021_MS_Paper_2B.pdf
          get "$p2/June%202021%20MS%20-%20Paper%202C%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2021_June/June_2021_MS_Paper_2C.pdf
          get "$p2/November%202021%20QP%20-%20Paper%202%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2021_November/November_2021_QP_Paper_2.pdf

          get "$p1/June%202022%20QP%20-%20Paper%201%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2022/June_2022_QP_Paper_1.pdf
          get "$p1/June%202022%20MS%20-%20Paper%201%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2022/June_2022_MS_Paper_1.pdf
          get "$p2/June%202022%20QP%20-%20Paper%202%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2022/June_2022_QP_Paper_2.pdf
          get "$p2/June%202022%20MS%20-%20Paper%202A%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2022/June_2022_MS_Paper_2A.pdf
          get "$p2/June%202022%20MS%20-%20Paper%202B%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2022/June_2022_MS_Paper_2B.pdf
          get "$p2/June%202022%20MS%20-%20Paper%202C%20Edexcel%20Computer%20Science%20IGCSE.pdf" out/2022/June_2022_MS_Paper_2C.pdf

          find out -type f -name '*.pdf' -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
          find out -type f -name '*.pdf' -printf '%P\t%s bytes\n' | sort > out/FILE_INVENTORY.tsv
          find out -type f -name '*.pdf' | wc -l | grep -qx '23'

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearson-4cp0-2019-2022-candidates
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
