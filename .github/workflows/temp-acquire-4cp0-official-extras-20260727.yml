name: Temporary acquire Pearson 4CP0 official extras

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Pearson files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/2019 out/2020 out/2021_June out/2021_November out/2022
          base='https://qualifications.pearson.com/content/dam/pdf/International%20GCSE/computer-science/2017/Exam-materials'

          get_pdf() {
            local name="$1" dest="$2"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' "$base/$name" -o "$dest"
            test "$(head -c 5 "$dest")" = '%PDF-'
            test "$(stat -c%s "$dest")" -gt 10000
            pdfinfo "$dest" >/dev/null
          }

          get_zip() {
            local name="$1" dest="$2"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' "$base/$name" -o "$dest"
            test "$(head -c 2 "$dest")" = 'PK'
            test "$(stat -c%s "$dest")" -gt 1000
            unzip -t "$dest" >/dev/null
          }

          get_pdf '4cp0-2a-rms-20220224.pdf' out/2021_November/4cp0-2a-rms-20220224.pdf
          get_pdf '4cp0-2b-rms-20220224.pdf' out/2021_November/4cp0-2b-rms-20220224.pdf

          get_zip '4CP0-02-data-files-june-2019.zip' out/2019/4CP0-02-data-files-june-2019.zip
          get_zip 'data-files-4cp0-02-november-2020.zip' out/2020/data-files-4cp0-02-november-2020.zip
          get_zip 'data-files-4cp0-02-june-2021.zip' out/2021_June/data-files-4cp0-02-june-2021.zip
          get_zip 'data-files-4cp0-02-november-2021.zip' out/2021_November/data-files-4cp0-02-november-2021.zip
          get_zip 'data-files-4cp0-02-june-2022.zip' out/2022/data-files-4cp0-02-june-2022.zip

          find out -type f \( -name '*.pdf' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
          find out -type f \( -name '*.pdf' -o -name '*.zip' \) -printf '%P\t%s bytes\n' | sort > out/FILE_INVENTORY.tsv
          find out -type f \( -name '*.pdf' -o -name '*.zip' \) | wc -l | grep -qx '7'

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearson-4cp0-official-extras-20260727
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
